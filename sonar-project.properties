# Organizacao e project key entram pelo workflow
# (variables SONAR_ORGANIZATION e SONAR_PROJECT_KEY).
sonar.projectName=Sistema Financeiro Reengenheirado
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports
sonar.sourceEncoding=UTF-8

# O job do GitHub Actions so libera o Docker Hub se o Quality Gate passar.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# A classe de demonstracao nao entra na meta de cobertura.
sonar.coverage.exclusions=**/Aplicacao.java
